# Статический Next.js (client/) → папка web/ → GitHub Pages.
# Вариант A: Settings → Pages → Source: GitHub Actions.
# Вариант B: Deploy from branch → ветка dev → Folder: /web (в web/ должен быть index.html и CNAME).
name: Deploy GitHub Pages

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install and build
        run: |
          cd client
          npm ci
          npm run build

      - name: Sync build into web/
        run: |
          touch client/out/.nojekyll
          cd web
          ls -A | grep -vx CNAME | xargs -r rm -rf
          cp -a ../client/out/. .
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
