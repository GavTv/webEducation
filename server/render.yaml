# Уже существующий сервис: https://webeducation.onrender.com (имя webEducation).
# Новый Blueprint не создавать — подхватит текущую базу.
services:
  - type: web
    name: webEducation
    runtime: node
    rootDir: server
    buildCommand: npm install
    preDeployCommand: npm run migrate:prod
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://my-workchat.ru,https://www.my-workchat.ru
      - key: CLIENT_URL
        value: https://my-workchat.ru
